<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sequential Workflow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Times New Roman', 'Georgia', serif;
  }
  .container {
    width: 900px;
    padding: 30px 20px 20px;
  }
  svg {
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Stage 1: MRI Input -->
  <rect x="20" y="165" width="110" height="70" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="75" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E40AF">MRI Input</text>
  <text x="75" y="210" text-anchor="middle" font-size="10" fill="#3B82F6">T1/T2</text>

  <!-- Arrow 1→2 -->
  <line x1="130" y1="200" x2="172" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="152" cy="200" r="9" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="152" y="204" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">1</text>

  <!-- Stage 2: Anatomical Extraction -->
  <rect x="175" y="160" width="130" height="80" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Anatomical</text>
  <text x="240" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">Extraction</text>
  <text x="240" y="222" text-anchor="middle" font-size="9.5" fill="#10B981">Brain masking</text>

  <!-- Arrow 2→3 -->
  <line x1="305" y1="200" x2="347" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="327" cy="200" r="9" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="327" y="204" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">2</text>

  <!-- Stage 3: EfficientNet-B4 (Central Hub) -->
  <rect x="350" y="155" width="140" height="90" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">EfficientNet</text>
  <text x="420" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">V2-S</text>
  <text x="420" y="218" text-anchor="middle" font-size="9.5" fill="#B45309">Classifier</text>

  <!-- Branch lines from EfficientNet → 4 outputs -->

  <!-- Top: Grad-CAM++ -->
  <path d="M 490 175 L 530 175 L 530 65 L 570 65" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="530" cy="120" r="9" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="530" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">3a</text>
  <rect x="573" y="35" width="120" height="60" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="633" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#5B21B6">Grad-CAM++</text>
  <text x="633" y="76" text-anchor="middle" font-size="9.5" fill="#7C3AED">Explainer</text>

  <!-- Upper-mid: YOLOv8m -->
  <path d="M 490 185 L 530 185 L 530 140 L 570 140" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="573" y="115" width="120" height="55" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="633" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#991B1B">YOLO11m</text>
  <text x="633" y="155" text-anchor="middle" font-size="9.5" fill="#DC2626">Detector</text>

  <!-- Lower-mid: Consensus -->
  <path d="M 490 215 L 530 215 L 530 260 L 570 260" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="530" cy="238" r="9" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="530" y="242" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">4C</text>
  <rect x="573" y="230" width="120" height="60" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="633" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#115E59">Consensus</text>
  <text x="633" y="273" text-anchor="middle" font-size="9.5" fill="#0D9488">Arbitration</text>

  <!-- Bottom: U-Net -->
  <path d="M 490 225 L 530 225 L 530 340 L 570 340" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="573" y="310" width="120" height="60" rx="8" fill="#FCE7F3" stroke="#EC4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="633" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#9D174D">U-Net++</text>
  <text x="633" y="353" text-anchor="middle" font-size="9.5" fill="#DB2777">Segmentor</text>

  <!-- Converge all → Flask Web -->
  <path d="M 693 65 L 730 65 L 730 200 L 760 200" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 693 142 L 730 142" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 693 260 L 730 260 L 730 200" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 693 340 L 745 340 L 745 200 L 760 200" fill="none" stroke="#333" stroke-width="1.5"/>
  
  <line x1="745" y1="200" x2="763" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="753" cy="200" r="9" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="753" y="204" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">5</text>

  <!-- Stage 4: Flask Web Dashboard -->
  <rect x="766" y="160" width="85" height="80" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="808" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#713F12">Flask</text>
  <text x="808" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#713F12">Web</text>
  <text x="808" y="225" text-anchor="middle" font-size="9" fill="#A16207">Dashboard</text>

  <!-- Number circle at branch split -->
  <circle cx="510" cy="175" r="9" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="510" y="179" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">3</text>
</svg>
</div>
</body>
</html>
